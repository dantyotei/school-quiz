body {

.correct {

}
.incorrect {

}

#question {

#header {
    content: "";

}
#point {
    float: left;
    padding: 0 0 0 10px;
}
#time {
    float: right;

#QuestionResult {

    text-align:center;
    justify-content: center;

    font-size:40px;
    height: 50px;
    margin: 10px;

#button {
    justify-content: center;
    text-align: center;
}

#but1, #but2, #but3, #but4, #but5 {
    padding: 20px 10px;
    font-size: 80px;
    font-weight: 600;
    text-shadow: 1px 2px 1px rgb(168, 168, 168);
    border-radius: 6px;
    margin: 5px;
    width: 15%;
    height: auto;
    min-height: 80px;
    display: inline-block;
    vertical-align: middle;
    color: #FFF;
    border: 1px solid #eadffc;
}

#but1 { background-color: #f13a3a; }
#but1:hover { background-color: #c93333; }

#but2 { background-color: #4114f6; }
#but2:hover { background-color: #3511c2; }

#but3 { background-color: #ffd83b; }
#but3:hover { background-color: #dfd814; }

#but4 { background-color: #14f650; }
#but4:hover { background-color: #10bd3e; }

#but5 { background-color: #14dcf6; }
#but5:hover { background-color: #11a2b5; }

.end {
    opacity: 0.5;
}

#start {
    width:50%;
    height:50%;
    padding: 5px 5px;
    font-size:90px;
    font-weight: 600;
    text-shadow: 1px 2px 1px rgb(168, 168, 168);
    border-radius: 6px;
    justify-content: center;
    margin: 5px;
    color: #FFF;
    background-color : #7df614;
    border: 1px solid #eadffc;
}
#start:hover {
    background-color : #5bb30e;
}
#reload {
    width:30%;
    padding: 5px 5px;
    font-size:20px;
    font-weight: 100;
    border-radius: 6px;
    justify-content: center;
    margin: 5px;
    color: #FFF;
    background-color : #ae14f6;
    border: 1px solid #eadffc;
}
#reload:hover {
    background-color : #9c14db;
}

select {
      font-size: 22px;
      margin: 10px;
      padding: 8px;
      justify-content: center;

#evaluation {
    margin: 0 10px 0 auto;
    justify-content: right;
    display: flex;
}

function select_question() {
    let idx = Math.floor(Math.random() * currentQuizList.length);
    question = currentQuizList[idx].q;
    correct = currentQuizList[idx].a;
    now_letter_number = 0;

    // 問題文の表示
    document.getElementById('question').innerHTML = question;

    // 画像の表示
    if (currentQuizList[idx].img) {
        document.getElementById('image_place').src = currentQuizList[idx].img;
        document.getElementById('image_place').style.display = "";
    } else {
        document.getElementById('image_place').style.display = "none";
    }
}

function letter_in(){
    document.getElementById('but1').innerHTML = letterA
    document.getElementById('but2').innerHTML = letterB
    document.getElementById('but3').innerHTML = letterC
    document.getElementById('but4').innerHTML = letterD
    document.getElementById('but5').innerHTML = letterE
}

function inner_button(){
    correct_place = Math.floor(Math.random() * 5 + 1);
    correct_letter = correct.charAt(now_letter_number);

    // すでに使った文字（正解文字も含めて）を避ける
    const used = new Set([correct_letter]);
    const pickUnique = () => {
        let ch;
        do {
            ch = All_letter.charAt(Math.floor(Math.random() * All_letter.length));
        } while (used.has(ch));  // 既出や正解と同じは回避
        used.add(ch);
        return ch;
    };

    // 重複なしの候補で埋める
    letterA = pickUnique();
    letterB = pickUnique();
    letterC = pickUnique();
    letterD = pickUnique();
    letterE = pickUnique();

    // 正解を1か所だけ上書き
    if (correct_place <= 1) {
        letterA = correct_letter;
    } else if (correct_place <= 2) {
        letterB = correct_letter;
    } else if (correct_place <= 3) {
        letterC = correct_letter;
    } else if (correct_place <= 4) {
        letterD = correct_letter;
    } else {
        letterE = correct_letter;
    }

    letter_in();
}

function proceedNext(delay = 800) {
  // 連打防止で一時的に無効化
  ["but1","but2","but3","but4","but5"].forEach(id => {
    document.getElementById(id).disabled = true;
  });

  setTimeout(() => {
    bc_normal();       // 背景色リセット
    select_question(); // ←ここで初めて問題を切り替える
    inner_button();    // 選択肢更新
    next_question();   // メッセージ消去＆新しい問題文表示

    // ボタンを再有効化
    ["but1","but2","but3","but4","but5"].forEach(id => {
      document.getElementById(id).disabled = false;
    });
  }, delay);
}


function but1(){
  now_letter_number++;

  if (letterA != correct_letter){
    document.getElementById('QuestionResult').innerHTML =
      "不正解…　正解は「 " + correct + " 」";
    document.getElementById("all").classList.add("incorrect");
    audio_ic();

    // ここでは問題を切り替えず、少し待ってから進む
    proceedNext(800);
  }
  else if (letterA == correct_letter && correct.length > now_letter_number){
    // まだ単語が完成していない：そのまま続行
    audio_but();
    inner_button();
  }
  else if (letterA == correct_letter && correct.length == now_letter_number){
    // 正解で語が完成
    score = score + correct.length;
    document.getElementById('point').innerHTML = score + "点";
    document.getElementById('QuestionResult').innerHTML = " 正解!";
    document.getElementById("all").classList.add("correct");
    audio_c();

    proceedNext(300);
  }
}

    document.getElementById("congrats").innerHTML = "";

    if (score >= storedHighScore) {
        localStorage.setItem(highScoreKey, score);
        document.getElementById("congrats").innerHTML = "🎉 最高記録を更新！おめでとう！ 🎉";
    }

    updateHighScoreDisplay();
}

function reload() {
    window.location.reload();
}

function showtime() {
    time--;
    if(time<0){
        end();
        document.getElementById("time").innerHTML = "終了！"
    }
    else{
        document.getElementById("time").innerHTML = "残り" + time + "秒"
    }
}


function timerstart() {
    time = 60;// カウンタのリセット
    setInterval('showtime()',1000); // タイマーをセット(1000ms間隔)
}
